# provider-customization.properties
#
# Build-time customization values. The example file ships with empty values
# and lets the app compile; a build with these keys left empty fails at
# runtime the first time that value is required (see ClaudeOAuthManager).
#
# Only needed to sign in with Claude OAuth credentials (API keys do not need
# it). Requests authenticated with OAuth must open their system prompt with
# the identifying line Claude Code itself sends, or the endpoint rejects them.
# Other open-source projects talking to the same endpoint declare the same
# identifier, e.g.
# https://github.com/Wei-Shaw/claude-relay-service
ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=Claude Code
