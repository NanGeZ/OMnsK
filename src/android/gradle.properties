# [T-stability] HARD ceiling is cgroup memory.max = 4GiB (not the 5.8GiB
# host RAM reported by `free`). dmesg confirms "Memory cgroup out of memory:
# Killed process ... (java) anon-rss:4039664kB" during :app:dexBuilderRelease —
# the JVM total (heap + metaspace + codecache + thread stacks + native D8/R8
# data) crossed 4GiB and the kernel OOM-killed it.
#
# `android.useFullClasspathForDexingTransform=true` is the AGP 8.3+ replacement
# for the removed `android.enableDexingArtifactTransform=false`. It tells the
# dexing artifact transform to hand D8 the FULL merged classpath rather than
# per-jar slices, so each D8 invocation is smaller and the peak is bounded.
# Combined with `org.gradle.workers.max=1` (serial) and `android.dexingMaxHeapSize`
# (capped D8 heap), this is the lowest-peak configuration AGP supports.
android.useFullClasspathForDexingTransform=true
android.enableGlobalSyntheticResources=false
# Force D8 itself to use a smaller heap than the daemon default; D8 runs in
# the Gradle worker, and this sets the fork's -Xmx when AGP forks one.
android.dexingMaxHeapSize=1200m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.java.home=/root/.local/share/mise/installs/java/17
# [T-stability] Container has 5.8GiB RAM and no swap. The default 4GiB daemon
# heap plus a separate 4GiB Kotlin daemon heap was observed to OOM-kill the
# Kotlin daemon mid `:app:compileReleaseKotlin` ("Detected multiple Kotlin
# daemon sessions" + OutOfMemoryError from the UncaughtExceptionHandler).
# Strategy: run Kotlin IN-PROCESS inside the Gradle daemon (single JVM, one
# budget), size that JVM to fit, and use the SerialGC (smaller pause-side
# footprint than ParallelGC on a memory-tight box).
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.incremental=false
kapt.use.worker.api=false
# [T-stability] IN-PROCESS compilation eliminates the second JVM entirely.
# The Kotlin daemon jvmargs below are kept only as a fallback — if
# `out-of-process` is ever flipped back on, they must be sized again.
kotlin.compiler.execution.strategy=in-process
# [T-stability-critical] The 4GiB cgroup ceiling is HARD. Daemon RSS at the
# dexBuilderRelease kill point is ~4.04GiB. Daemon heap + metaspace + codecache
# must leave 2.4GiB of headroom for the D8 worker that runs inside the same
# process. With -Xmx1200m + 320m metaspace + 96m codecache + ~300m
# thread-stacks/GC/native, the daemon itself is ~1.9GiB and D8 gets the rest.
#
# MUST set -XX:MaxRAMPercentage as well as -Xmx. AGP's DexingWorkAction
# forked worker computes its own -Xmx as a FRACTION OF CONTAINER RAM (4GiB),
# not from `android.dexingMaxHeapSize` (which only sets the worker's soft
# memory limit, not its -Xmx). dmesg shows `total-vm:7564828kB` — a 7.5GB
# JVM reservation. MaxRAMPercentage=50 caps the forked worker's heap at 2GB.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# [T-noise] AGP 8.7.3 is only tested up to compileSdk 35; the project is pinned
# to 36 (correct for the target API level). Silence the compiler warning so the
# build log is clean.
android.suppressUnsupportedCompileSdk=36
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
